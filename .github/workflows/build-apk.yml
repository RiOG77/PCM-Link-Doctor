name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bootstrap Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Upload wrapper bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-bootstrap
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

      - name: Static safety policy
        run: bash scripts/ci_safety_check.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          for p in \
            android.permission.INTERNET \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.MANAGE_EXTERNAL_STORAGE \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.WRITE_SECURE_SETTINGS \
            android.permission.PACKAGE_USAGE_STATS; do
            if grep -Fq "$p" /tmp/apk-permissions.txt; then
              echo "Forbidden permission in APK: $p" >&2
              exit 1
            fi
          done

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PCM-Link-Doctor-v0.2.0-Knox-safe-debug.apk
          sha256sum dist/PCM-Link-Doctor-v0.2.0-Knox-safe-debug.apk | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCM-Link-Doctor-v0.2.0-Knox-safe-debug
          path: dist/
          if-no-files-found: error
