name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PCM-Link-Doctor-v0.1-debug.apk
          sha256sum dist/PCM-Link-Doctor-v0.1-debug.apk | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCM-Link-Doctor-v0.1-debug
          path: dist/
          if-no-files-found: error
