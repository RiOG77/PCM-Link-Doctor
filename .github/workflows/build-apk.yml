name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13 once
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate official wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already committed"
            exit 0
          fi
          git commit -m "Add Gradle Wrapper 8.13"
          git push origin HEAD:main
