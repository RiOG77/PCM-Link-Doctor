plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcmlink.doctor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pcmlink.doctor'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
